services:
  # Optional local model server. Only started explicitly for the local benchmark:
  #   docker compose up -d ollama
  ollama:
    image: ollama/ollama:0.40.9   # guide pinned 0.34.4 (outdated); 0.40.9 verified 2026-10-26, has arm64
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Agent runtime. Works with Ollama stopped (hosted Gemini profiles).
  adk:
    build: .
    env_file:
      - .env                       # key injected at RUN time, never baked into the image
    environment:
      OLLAMA_API_BASE: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - .:/app                     # live code mount for development
    command: ["adk", "api_server", "--host", "0.0.0.0", "--port", "8000", "/app"]

volumes:
  ollama_data:
